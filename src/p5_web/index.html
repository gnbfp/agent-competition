<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跑步训练报告</title>
  <link rel="stylesheet" href="./dashboard.css">
  <script src="./dashboard.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <h1>跑步训练报告</h1>
      <a class="jump" href="#weekly">查看下周安排 <span aria-hidden="true">↓</span></a>
    </div>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <section class="panel controls" id="local-controls" hidden>
        <h2>离线演示</h2>
        <div class="actions">
          <button class="primary" type="button" id="demo">运行草案演示</button>
          <button type="button" id="review">运行复核演示</button>
        </div>
        <details class="import-box">
          <summary>导入自己的 CSV</summary>
          <form id="csv-form">
            <label>CSV 文件 <input required type="file" accept=".csv,text/csv" name="csv"></label>
            <div class="field-grid">
              <label>计算截止日 <input required type="date" name="as_of"></label>
              <label>数据起始日 <input type="date" name="history_start"></label>
              <label>静息心率 <input required type="number" name="resting_hr" inputmode="numeric"></label>
              <label>个人最大心率 <input required type="number" name="max_hr" inputmode="numeric"></label>
            </div>
            <label>TRIMP 系数 <select name="trimp_profile" required><option value="">请选择</option><option value="female">女性系数</option><option value="male">男性系数</option></select></label>
            <details class="supplements">
              <summary>来源与补充资料</summary>
              <label>CSV 来源 <select name="source"><option value="auto">自动识别</option><option value="middle">中间格式</option><option value="garmin">Garmin</option><option value="huawei">华为</option></select></label>
              <label>匿名 ID <input name="athlete" value="anon_01" maxlength="40" pattern="[A-Za-z0-9_\-]+"></label>
              <label>补充量测 JSON <input type="file" accept=".json,application/json" name="measurements"></label>
              <label>规则上下文 JSON <input type="file" accept=".json,application/json" name="context"></label>
            </details>
            <button class="primary" type="submit">导入并生成报告</button>
          </form>
        </details>
        <p id="run-status" class="run-status" role="status" aria-live="polite"></p>
      </section>
      <section id="quality" class="panel" hidden>
        <h2>导入体检</h2><dl id="quality-stats" class="quality-stats"></dl>
      </section>
      <section class="panel" id="followup" hidden>
        <h2>需要补充的信息</h2>
        <form id="answer-form"><div id="questions"></div><button class="primary" type="submit">提交答复并复算</button></form>
        <p id="question-note" class="muted"></p>
      </section>
    </aside>
    <section class="report" id="report" aria-label="训练分析">
      <p id="initial-error" class="panel" role="alert" hidden></p>
      <section class="panel overview" id="overview" hidden>
        <div class="overview-top"><div><p id="window" class="eyebrow"></p><h2 id="headline"></h2></div><span class="pill" id="decision"></span></div>
        <div class="metrics" id="metrics"></div>
      </section>
      <section class="panel" id="load-panel" hidden>
        <div class="section-title"><h2>训练负荷趋势</h2><span class="eyebrow">逐日 TRIMP</span></div>
        <div class="chart"><canvas id="load-chart" aria-label="逐日训练负荷折线图" role="img"></canvas><p id="chart-empty" class="empty" hidden>暂无可用的负荷记录。</p></div>
        <p class="muted">断点表示当日负荷未知，零值表示已确认无训练负荷。</p>
        <details id="load-values"><summary>查看逐日数值</summary><ul id="load-list" class="load-list"></ul></details>
      </section>
      <section class="panel" id="risk-panel" hidden>
        <div class="section-title"><h2>信号与依据</h2><span class="eyebrow" id="risk-count"></span></div>
        <div id="risk-list"></div>
      </section>
      <section class="panel" id="weekly" hidden>
        <div class="section-title"><h2>下周安排</h2><span class="eyebrow" id="week-start"></span></div>
        <div id="week-content"></div>
        <details id="attempts" hidden><summary>查看计划自检记录</summary><div id="attempt-list"></div></details>
      </section>
    </section>
  </main>
</body>
</html>
